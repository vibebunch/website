<!DOCTYPE html>
<!-- Source for og-image.png, the picture that appears when someone shares a link to
     vibebunch.com in WhatsApp, LinkedIn, iMessage and so on. It is 1200 by 630 pixels.
     To remake it after a change, take a 1200 by 630 screenshot of this page with any
     headless browser, save it as og-image.png in the top folder, and commit it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Vibe Bunch share image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #E3ECFB; color: #1C2433; font-family: "Plus Jakarta Sans", sans-serif; position: relative; }
  .content { position: absolute; left: 80px; top: 70px; right: 80px; display: flex; flex-direction: column; gap: 26px; z-index: 1; }
  .logo { display: flex; align-items: center; gap: 18px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 44px; }
  h1 { margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 84px; line-height: 0.98; letter-spacing: -0.03em; max-width: 900px; }
  .stickers { display: flex; gap: 14px; }
  .sticker { background: #fff; border: 3px solid #1C2433; border-radius: 999px; padding: 8px 20px; font-size: 24px; font-weight: 700; transform: rotate(-2deg); }
  .yolk { background: #FFC23A; transform: rotate(1.5deg); }
  svg.skyline { position: absolute; left: 0; bottom: 0; width: 1200px; height: 150px; }
</style>
</head>
<body>
  <div class="content">
    <div class="logo">
      <svg width="58" height="58" viewBox="0 0 34 34"><ellipse cx="17" cy="18" rx="15" ry="13" fill="#FFFFFF" stroke="#1C2433" stroke-width="2"/><circle cx="17" cy="18" r="6.5" fill="#FFC23A" stroke="#1C2433" stroke-width="2"/></svg>
      Vibe Bunch
    </div>
    <h1>Saturday brunch for people building things with AI.</h1>
    <div class="stickers">
      <span class="sticker">Beginners welcome</span>
      <span class="sticker yolk">Longmont &amp; Boulder, Colorado</span>
    </div>
  </div>
  <svg class="skyline" viewBox="0 0 1280 220" preserveAspectRatio="none">
    <path d="M0 220 L0 150 L120 120 L210 138 L300 96 L360 110 L420 60 L470 104 L520 40 L575 100 L630 30 L690 104 L760 84 L860 126 L980 98 L1090 132 L1180 110 L1280 128 L1280 220 Z" fill="#9DB6EA"/>
    <path d="M0 220 L0 186 L160 168 L300 178 L460 150 L640 172 L820 150 L1000 170 L1160 156 L1280 166 L1280 220 Z" fill="#FBFCFE"/>
  </svg>
</body>
</html>
